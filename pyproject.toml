[project]
name = "dsa-tuberag"
version = "0.1.0"
description = "Timestamp-accurate RAG system for Padho with Pratyush DSA playlist"
requires-python = ">=3.12"
dependencies = [
    "qdrant-client[fastembed]>=1.12",
    "sentence-transformers>=3.3",
    "google-genai>=1.10",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "typer>=0.15",
    "rich>=13.9",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "tqdm>=4.67",
    "pydantic>=2.9",
    "httpx>=0.27",
    "fastembed>=0.8.0",
]

[project.scripts]
tuberag = "cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]
